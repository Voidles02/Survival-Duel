challenge-timeout-seconds: 30
countdown-seconds: 3
command-cooldown-seconds: 2
max-group-size: 4
allow-uneven: false

messages:
  no-permission: "<red>You don't have permission to do that."
  player-only: "<red>This command can only be used by a player."
  cooldown: "<gray>Please wait {seconds}s before using another duel command."
  usage: "<yellow>Usage: /duel <player|accept [player]|deny [player]|cancel|forfeit|group|reload>"
  player-not-found: "<red>That player is not online."
  self-duel: "<red>You cannot challenge yourself or your own group."
  already-dueling: "<red>Someone on one of those sides is already in a duel."
  group-leader-offline: "<red>The target group's leader must be online to answer."
  uneven-sides: "<red>Duel sides must have the same number of online players."
  challenge-sent: "<green>Challenge sent to {player}."
  challenge-received: "<yellow>{player} challenged you. <click:run_command:'/duel accept {player}'><hover:show_text:'<green>Accept duel'><green>[ACCEPT]</green></hover></click> <click:run_command:'/duel deny {player}'><hover:show_text:'<red>Decline duel'><red>[DECLINE]</red></hover></click>"
  challenge-pending: "<yellow>A challenge involving you is already pending."
  challenge-accepted: "<green>{player} accepted the duel challenge."
  challenge-denied: "<red>{player} declined the duel challenge."
  challenge-expired: "<gray>The duel challenge with {player} expired."
  challenge-cancelled: "<gray>The duel challenge with {player} was cancelled."
  no-pending-challenge: "<red>You have no matching pending challenge."
  challenge-invalid: "<red>The challenge is no longer valid."
  countdown: "<yellow>Duel starts in {seconds}..."
  duel-start-player: "<red>You are dueling {player}!"
  duel-start-group: "<red>You are dueling {player}'s group!"
  bossbar-player-title: "<red>You're dueling {player}"
  bossbar-group-title: "<red>You're dueling {player}'s group"
  duel-winner: "<gold>{player} won the duel."
  duel-forfeit: "<yellow>{player} forfeited the duel."
  not-in-duel: "<red>You are not in a duel."
  reloaded: "<green>SurvivalDuel configuration reloaded."
  group-usage: "<yellow>Usage: /duel group <create|invite|accept|deny|leave|kick|list|disband>"
  group-created: "<green>You created a duel group."
  group-already-in: "<red>You are already in a group."
  group-not-in: "<red>You are not in a group."
  group-leader-only: "<red>Only your group leader can do that."
  group-invite-sent: "<green>Group invitation sent to {player}."
  group-invite-received: "<yellow>{player} invited you to a duel group. <click:run_command:'/duel group accept'><hover:show_text:'<green>Join group'><green>[ACCEPT]</green></hover></click> <click:run_command:'/duel group deny'><hover:show_text:'<red>Decline invite'><red>[DECLINE]</red></hover></click>"
  group-invite-expired: "<gray>Your group invitation from {player} expired."
  group-invite-cancelled: "<gray>Your group invitation is no longer valid."
  group-invite-pending: "<yellow>You already have a pending group invitation."
  group-not-invited: "<red>You have no valid group invitation."
  group-full: "<red>That group is full."
  group-joined: "<green>{player} joined the group."
  group-denied: "<gray>{player} declined the group invitation."
  group-left: "<gray>You left the group."
  group-member-left: "<yellow>{player} left the group."
  group-leader-changed: "<yellow>{player} is now the group leader."
  group-kicked: "<red>You were removed from the group by {player}."
  group-disbanded: "<gray>The group was disbanded by {player}."
  group-self-kick: "<red>You cannot kick yourself."
  group-not-member: "<red>That player is not in your group."
  group-list: "<yellow>Group ({size}): {members}"